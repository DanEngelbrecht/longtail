name: Build Master

on:
  push:
    branches: [ main ]

jobs:
  build-linux:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [debug, release]
        target: [static_lib, shared_lib, cmd]

    steps:
    - uses: actions/checkout@v4
    - name: build ${{matrix.target}}
      run: |
        ${{matrix.target}}/build.sh ${{matrix.config}}

    - uses: actions/upload-artifact@v4
      name: upload ${{matrix.target}}
      with:
        name: linux_x64-${{matrix.target}}-${{matrix.config}}
        path: |
          build/**
          !build/**/*.o
          !build/**/third-party/**

  test-linux:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [debug, release]
    steps:
    - uses: actions/checkout@v4
    - name: build test
      run: |
        test/build.sh ${{matrix.config}}
    - name: run tests
      run: |
        cd ./test
        ../build/linux_x64/test/${{matrix.config}}/test
        cd ..

  dist-linux:

    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: build/artifacts
    - name: build dist
      run: |
        ./dist.sh
    - uses: actions/upload-artifact@v4
      with:
        name: dist-linux-x64
        path: dist

  build-darwin:

    runs-on: macos-13
    strategy:
      matrix:
        config: [debug, release]
        target: [static_lib, shared_lib, cmd]
        arch: [arm64, x64]
    steps:
    - uses: actions/checkout@v4
    - name: build ${{matrix.target}}
      run: |
        ${{matrix.target}}/build.sh ${{matrix.config}} ${{matrix.arch}}

    - uses: actions/upload-artifact@v4
      name: upload ${{matrix.target}}
      with:
        name: darwin_${{matrix.arch}}-${{matrix.target}}-${{matrix.config}}
        path: |
          build/**
          !build/**/*.o
          !build/**/third-party/**

  test-darwin:

    runs-on: macos-13
    strategy:
      matrix:
        config: [debug, release]
        arch: [arm64, x64]
    steps:
    - uses: actions/checkout@v4
    - name: build test
      run: |
        test/build.sh ${{matrix.config}} ${{matrix.arch}}
    - name: run tests
      if: ${{ matrix.arch == 'x64' }}
      run: |
        cd ./test
        ../build/darwin_${{matrix.arch}}/test/${{matrix.config}}/test
        cd ..

  dist-darwin:

    needs: build-darwin
    runs-on: macos-13
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: build/artifacts
    - name: build dist
      run: |
        ./dist.sh ${{matrix.arch}}
    - uses: actions/upload-artifact@v4
      with:
        name: dist-darwin-${{matrix.arch}}
        path: dist

  build-win32:

    runs-on: windows-2022
    strategy:
      matrix:
        config: [debug, release]
        target: [static_lib, shared_lib, cmd]
        arch: [x64, arm64]

    steps:
    - uses: actions/checkout@v4
    - name: build ${{matrix.target}}
      run: |
        if ("${{matrix.arch}}" -eq "arm64") {
          ${{matrix.target}}/build.bat arm64 ${{matrix.config}}
        } else {
          ${{matrix.target}}/build.bat ${{matrix.config}}
        }

    - uses: actions/upload-artifact@v4
      name: upload ${{matrix.target}}
      with:
        name: win32_${{matrix.arch}}-${{matrix.target}}-${{matrix.config}}
        path: |
          build/**
          !build/**/*.obj
          !build/**/*.o
          !build/**/third-party/**

  build-win-arm64:

    runs-on: windows-11-arm
    strategy:
      matrix:
        config: [debug, release]
        target: [static_lib, shared_lib, cmd]

    steps:
    - uses: actions/checkout@v4
    - name: build ${{matrix.target}}
      run: |
        ${{matrix.target}}/build.bat arm64 ${{matrix.config}}

    - uses: actions/upload-artifact@v4
      name: upload ${{matrix.target}}
      with:
        name: win_arm64-${{matrix.target}}-${{matrix.config}}
        path: |
          build/**
          !build/**/*.obj
          !build/**/*.o
          !build/**/third-party/**

  test-win32:

    runs-on: windows-2022
    strategy:
      matrix:
        config: [debug, release]
    steps:
    - uses: actions/checkout@v4
    - name: build test
      run: |
        test/build.bat ${{matrix.config}}
    - name: run tests
      run: |
        cd ./test
        ../build/win32_x64/test/${{matrix.config}}/test.exe
        cd ..

  test-win-arm64:

    runs-on: windows-11-arm
    strategy:
      matrix:
        config: [debug, release]
    steps:
    - uses: actions/checkout@v4
    - name: build test
      run: |
        test/build.bat arm64 ${{matrix.config}}
    - name: run tests
      run: |
        cd ./test
        ../build/win_arm64/test/${{matrix.config}}/test.exe
        cd ..

  dist-win32:

    needs: [build-win32, build-win-arm64]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: build/artifacts
    - name: build dist
      run: |
        ./dist.bat
    - uses: actions/upload-artifact@v4
      with:
        name: dist-win32-x64
        path: dist

  dist-win-arm64:

    needs: build-win-arm64
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: build/artifacts
    - name: build dist
      run: |
        ./dist.bat arm64
    - uses: actions/upload-artifact@v4
      with:
        name: dist-win-arm64
        path: dist
